openapi: 3.1.0
info:
  title: English Self-Study WebApp API
  version: 1.0.0
  description: >
    API contract chuẩn hóa cho ứng dụng webapp tự học tiếng Anh theo lộ trình.
    Tuân thủ BE_CODE_CONVENTION.md, FE_CODE_CONVENTION.md, và các sửa đổi G0-FIX.
    Bảo mật bằng HttpOnly Session Cookie và X-CSRF-TOKEN.
servers:
  - url: /api/v1
    description: API v1 Endpoint

security:
  - CookieAuth: []

paths:
  # ===========================================================================
  # 1. AUTHENTICATION & SESSION
  # ===========================================================================
  /auth/csrf:
    get:
      summary: Lấy CSRF token cho phiên làm việc
      description: Trả về CSRF token trong bộ nhớ. Cache-Control no-store.
      operationId: getCsrfToken
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: CSRF token hiện hành
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'

  /auth/login:
    post:
      summary: Đăng nhập người học
      description: Xác thực người dùng và thiết lập HttpOnly session cookie. Yêu cầu CSRF token.
      operationId: login
      tags: [Authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /auth/logout:
    post:
      summary: Đăng xuất
      description: Hủy session cookie và làm mất hiệu lực phiên làm việc.
      operationId: logout
      tags: [Authentication]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đăng xuất thành công, không có body
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /me:
    get:
      summary: Lấy thông tin tài khoản hiện hành
      operationId: getCurrentUser
      tags: [Identity]
      responses:
        '200':
          description: Thông tin người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /me/preferences:
    get:
      summary: Lấy tùy chọn cá nhân của người học
      operationId: getPreferences
      tags: [Identity]
      responses:
        '200':
          description: Tùy chọn học tập hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPreferencesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    patch:
      summary: Cập nhật tùy chọn cá nhân
      operationId: updatePreferences
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Tùy chọn đã được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  # ===========================================================================
  # 2. CURRICULUM & CATALOG
  # ===========================================================================
  /curricula:
    get:
      summary: Lấy danh sách lộ trình học tập
      operationId: listCurricula
      tags: [Curriculum]
      security: []
      responses:
        '200':
          description: Danh sách lộ trình công khai có phiên bản Published
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurriculumSummaryResponse'

  /curricula/{slug}:
    get:
      summary: Lấy chi tiết lộ trình theo slug
      operationId: getCurriculumBySlug
      tags: [Curriculum]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: pilot-curriculum
      responses:
        '200':
          description: Chi tiết lộ trình kèm phiên bản xuất bản hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /revisions/{revisionId}/outline:
    get:
      summary: Lấy cấu trúc mục lục nhẹ (Outline) của phiên bản lộ trình
      operationId: getRevisionOutline
      tags: [Curriculum]
      security: []
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mục lục các giai đoạn, tuần và buổi học (không tải Markdown)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionOutlineResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  # ===========================================================================
  # 3. ENROLLMENT & LEARNING PROGRESS
  # ===========================================================================
  /enrollments:
    post:
      summary: Đăng ký một lộ trình học tập
      description: Tạo mới enrollment với lịch học ban đầu. Bắt buộc Idempotency-Key.
      operationId: createEnrollment
      tags: [Enrollment]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}:
    get:
      summary: Lấy chi tiết thông tin và phiên bản hiện hành của enrollment
      description: Cung cấp enrollmentVersion và cấu hình lịch học sau khi reload trang.
      operationId: getEnrollmentDetail
      tags: [Enrollment]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết enrollment và version đồng bộ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /me/enrollments:
    get:
      summary: Danh sách lộ trình người dùng đã đăng ký
      operationId: getMyEnrollments
      tags: [Enrollment]
      responses:
        '200':
          description: Danh sách enrollment của người dùng hiện hành kèm version
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /me/today:
    get:
      summary: Lấy thông tin học tập của trang Hôm nay
      description: >
        Trả về trạng thái Hôm nay và hành động chính dựa trên thứ tự ưu tiên.
        Biểu diễn đầy đủ các trạng thái: NO_ENROLLMENT, PAUSED, IN_PROGRESS, DUE_TODAY, REST_DAY, OVERDUE, UPCOMING, CURRICULUM_COMPLETED.
        Luôn trả kèm enrollmentVersion để phục vụ đồng bộ sau reload.
      operationId: getTodayDashboard
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Nếu không cung cấp, lấy enrollment đang tập trung.
      responses:
        '200':
          description: Dữ liệu trang Hôm nay theo trạng thái hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /enrollments/{enrollmentId}/lessons/{lessonId}:
    get:
      summary: Lấy chi tiết không gian học của một buổi học
      description: >
        Trả về nội dung Markdown, danh sách nhiệm vụ, trạng thái học của từng nhiệm vụ,
        câu trả lời đã lưu, và enrollmentVersion hiện hành để client gửi mutation có optimistic locking.
      operationId: getLessonWorkspace
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết không gian buổi học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/lessons/{lessonId}/summary:
    get:
      summary: Lấy thông tin tóm tắt chỉ đọc của một buổi học trong enrollment
      description: >
        Trả về tiêu đề lộ trình, tiêu đề bài học, thời lượng ước tính và ngày học dự kiến.
        Chỉ owner của enrollment mới có quyền truy cập. Kiểm tra lesson thuộc revision đã đăng ký.
      operationId: getLessonSummary
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin tóm tắt buổi học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/lessons/{lessonId}/activities:
    get:
      summary: Lấy danh sách nhiệm vụ của buổi học theo enrollment
      description: >
        Read model nhẹ để UI thao tác nhiệm vụ trong G3-02.
        Trả envelope lessonId, enrollmentVersion, activities[].
        Mỗi activity có id, title, type, required, completionPolicy, status, responseText nullable.
        Không chứa Markdown hoặc payload quiz.
      operationId: getLessonActivities
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách nhiệm vụ của buổi học kèm tiến độ của người học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonActivitiesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/activities/{activityId}/progress:
    put:
      summary: Cập nhật trạng thái hoàn thành nhiệm vụ thủ công (Complete / Undo)
      description: >
        Cập nhật tiến độ của READING, EXTERNAL_RESOURCE, PRACTICE.
        Với REFLECTION, nếu chưa có nội dung trả lời sẽ bị từ chối 400 RESPONSE_REQUIRED.
        Yêu cầu expectedVersion (enrollmentVersion).
      operationId: updateActivityProgress
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgressRequest'
      responses:
        '200':
          description: Trạng thái tiến độ mới nhất sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/activities/{activityId}/response:
    put:
      summary: Lưu bản nháp câu trả lời thực hành hoặc phản tư
      description: >
        Lưu nháp text câu trả lời. KHÔNG tự động chuyển trạng thái hoàn thành activity.
      operationId: saveActivityResponseDraft
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveResponseDraftRequest'
      responses:
        '200':
          description: Bản nháp phản hồi đã được lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponseDto'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/activities/{activityId}/response/submit:
    post:
      summary: Nộp câu trả lời phản tư và xác nhận hoàn thành (Submit Response)
      description: >
        Yêu cầu responseText không rỗng và expectedVersion.
        Lưu câu trả lời và chuyển trạng thái activity sang COMPLETED nguyên tử trong 1 transaction,
        tăng enrollmentVersion và trả về ProgressResponse.
      operationId: submitActivityResponse
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitResponseRequest'
      responses:
        '200':
          description: Phản hồi đã nộp thành công và activity đã hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/activities/{activityId}/quiz:
    get:
      summary: Lấy thông tin câu hỏi và các lựa chọn của bài kiểm tra trắc nghiệm
      description: >
        Trả về danh sách câu hỏi và lựa chọn để người học làm bài.
        Tuyệt đối không trả về đáp án đúng (isCorrect) hay lời giải thích (explanation).
      operationId: getQuiz
      tags: [Assessment]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đề bài trắc nghiệm và lần làm bài gần nhất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/activities/{activityId}/quiz/submit:
    post:
      summary: Nộp bài kiểm tra trắc nghiệm và nhận kết quả chấm tự động
      description: >
        Server chấm điểm tự động toàn bộ câu trả lời, tính điểm, xác định đạt/chưa đạt theo chính sách,
        lưu lần làm bài và cập nhật tiến độ học tập nếu đạt.
      operationId: submitQuiz
      tags: [Assessment]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
      responses:
        '200':
          description: Kết quả chấm điểm bài trắc nghiệm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResultResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/summary:
    get:
      summary: Lấy tóm tắt tiến độ tổng thể của enrollment
      description: Trả về số đếm nhiệm vụ, phần trăm tiến độ và enrollmentVersion hiện hành.
      operationId: getEnrollmentSummary
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thống kê số lượng nhiệm vụ và phần trăm tiến độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/analytics:
    get:
      summary: Lấy dữ liệu thống kê tiến độ trực quan và lịch sử học tập
      description: >
        Trả về các chỉ số KPI tiến độ, chuỗi ngày học liên tục (streak),
        biểu đồ thanh theo tuần (weekly progress), và lịch sử hoạt động theo ngày thực tế.
      operationId: getEnrollmentAnalytics
      tags: [Learning]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dữ liệu phân tích và thống kê tiến độ học tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentAnalyticsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'


  # ===========================================================================
  # REVIEW & BOOKMARKS (G5-02)
  # ===========================================================================
  /enrollments/{enrollmentId}/review:
    get:
      summary: Lấy tổng hợp danh sách câu sai và bài học đã đánh dấu ôn tập
      description: >
        Trả về danh sách câu hỏi làm sai từ các bài kiểm tra trắc nghiệm gần nhất
        và danh sách bài học/nhiệm vụ đã được người học đánh dấu (bookmark).
      operationId: getReviewSummary
      tags: [Review]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách câu sai và bài đánh dấu ôn tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /review-bookmarks:
    post:
      summary: Đánh dấu bài học hoặc nhiệm vụ để ôn tập
      operationId: createBookmark
      tags: [Review]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkRequest'
      responses:
        '201':
          description: Đã tạo bookmark thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /review-bookmarks/{id}:
    delete:
      summary: Xóa đánh dấu ôn tập
      operationId: deleteBookmark
      tags: [Review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã xóa bookmark thành công
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/review/questions/{questionId}/checks:
    post:
      summary: Làm lại và kiểm tra câu hỏi sai trong màn hình ôn tập
      description: >
        Kiểm tra câu trả lời của người học cho một câu hỏi sai.
        Nếu đúng, ghi nhận resolution và chuyển câu hỏi sang trạng thái resolved.
        Không thay đổi điểm số của bài quiz gốc.
      operationId: checkMistakeQuestion
      tags: [Review]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckQuestionRequest'
      responses:
        '200':
          description: Kết quả kiểm tra câu hỏi ôn tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  # ===========================================================================
  # 4. NOTES (GHI CHÚ HỌC TẬP)
  # ===========================================================================
  /me/notes:
    get:
      summary: Lấy danh sách ghi chú cá nhân có phân trang
      operationId: getMyNotes
      tags: [Notes]
      parameters:
        - name: enrollmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lessonId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Danh sách ghi chú phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /notes:
    post:
      summary: Tạo mới ghi chú
      operationId: createNote
      tags: [Notes]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Ghi chú đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /notes/{id}:
    patch:
      summary: Cập nhật ghi chú (hỗ trợ autosave và optimistic lock)
      operationId: updateNote
      tags: [Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Ghi chú đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
    delete:
      summary: Xóa ghi chú
      operationId: deleteNote
      tags: [Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            description: Version hiện tại của ghi chú để kiểm tra xung đột
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã xóa thành công
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  # ===========================================================================
  # 5. SCHEDULING & RESCHEDULING
  # ===========================================================================
  /enrollments/{enrollmentId}/schedule:
    get:
      summary: Lấy danh sách lịch học của enrollment theo khoảng ngày
      operationId: getSchedule
      tags: [Scheduling]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-10-26'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-11-30'
      responses:
        '200':
          description: Danh sách lịch học các buổi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /enrollments/{enrollmentId}/schedule/preview:
    post:
      summary: Xem trước kết quả đổi lịch học
      description: Tính toán phân bổ ngày mới cho các bài chưa học, không lưu vào cơ sở dữ liệu.
      operationId: previewReschedule
      tags: [Scheduling]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePreviewRequest'
      responses:
        '200':
          description: Bản xem trước lịch mới kèm enrollmentVersion để commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/schedule/commit:
    post:
      summary: Áp dụng lịch học mới
      description: Lưu lịch học đã xem trước vào database. Yêu cầu expectedVersion và Idempotency-Key.
      operationId: commitReschedule
      tags: [Scheduling]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCommitRequest'
      responses:
        '200':
          description: Lịch học mới đã được áp dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/pause:
    post:
      summary: Tạm dừng lộ trình học (G4)
      description: Đóng băng tiến độ, ngừng tạo cảnh báo quá hạn. Yêu cầu expectedVersion.
      operationId: pauseEnrollment
      tags: [EnrollmentLifecycle]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Enrollment đã chuyển sang trạng thái PAUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/resume:
    post:
      summary: Tiếp tục lộ trình học với lịch mới (G4)
      description: Tiếp tục học và phân bổ lại lịch chưa học trong 1 transaction duy nhất.
      operationId: resumeEnrollment
      tags: [EnrollmentLifecycle]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCommitRequest'
      responses:
        '200':
          description: Enrollment đã tiếp tục và lịch mới đã được kích hoạt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /enrollments/{enrollmentId}/abandon:
    post:
      summary: Chủ động kết thúc lần học dở để đăng ký lại từ đầu (G4)
      description: Chuyển enrollment sang ABANDONED (read-only).
      operationId: abandonEnrollment
      tags: [EnrollmentLifecycle]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Enrollment đã chuyển sang trạng thái ABANDONED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

# =============================================================================
# COMPONENTS (SCHEMAS, RESPONSES, PARAMETERS, SECURITY)
# =============================================================================
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Security HttpOnly session cookie

  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: CSRF token lấy từ endpoint GET /auth/csrf

    IdempotencyKeyHeaderRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Khóa chống lặp bắt buộc cho các thao tác ghi nhạy cảm (ADR-003)

    IdempotencyKeyHeaderOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Khóa chống lặp tùy chọn

  responses:
    BadRequestProblem:
      description: Yêu cầu không hợp lệ (400)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnauthorizedProblem:
      description: Yêu cầu xác thực phiên đăng nhập (401)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ForbiddenProblem:
      description: Bị từ chối do thiếu quyền hoặc CSRF token không hợp lệ (403)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFoundProblem:
      description: Tài nguyên không tồn tại hoặc không thuộc người học (404)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ConflictProblem:
      description: Xung đột phiên lạc quan hoặc trạng thái nghiệp vụ (409)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    # --- Problem Details (RFC 7807) ---
    ProblemDetail:
      type: object
      required: [type, title, status, detail, code, traceId, fieldErrors]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Dữ liệu đã thay đổi từ một phiên khác. Vui lòng tải lại.
        instance:
          type: [string, "null"]
          example: /api/v1/enrollments/8f9a2b/activities/c4d1/progress
        code:
          type: string
          example: VERSION_CONFLICT
        traceId:
          type: string
          example: 7c8e1a90f1b2
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'

    FieldViolation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: startDate
        code:
          type: string
          example: INVALID_DATE
        message:
          type: string
          example: Ngày bắt đầu không thể là ngày trong quá khứ.

    # --- Pagination ---
    NotePageResponse:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NoteResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 5
        totalPages:
          type: integer
          example: 1

    # --- Auth & User ---
    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        token:
          type: string
          example: f9d2a4e8-7c1b-4d3e-a8f2-5b9c0e1d3a7f

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: giangdinh
        password:
          type: string
          format: password
          example: Password123!

    UserResponse:
      type: object
      required: [id, username, fullName, timeZone, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: giangdinh
        fullName:
          type: string
          example: Giang Dinh
        timeZone:
          type: string
          example: Asia/Ho_Chi_Minh
        role:
          type: string
          enum: [LEARNER, ADMIN]

    UpdatePreferencesRequest:
      type: object
      properties:
        dailyTargetMinutes:
          type: [integer, "null"]
          minimum: 10
          maximum: 180
          example: 30
        focusedEnrollmentId:
          type: [string, "null"]
          format: uuid

    LearnerPreferencesResponse:
      type: object
      required: [dailyTargetMinutes]
      properties:
        dailyTargetMinutes:
          type: integer
          example: 30
        focusedEnrollmentId:
          type: [string, "null"]
          format: uuid

    # --- Curriculum Models ---
    CurriculumSummaryResponse:
      type: object
      required: [id, slug, title, description, targetLocale, currentRevisionId, currentRevisionVersion]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: pilot-curriculum
        title:
          type: string
          example: 'Lộ trình Thử nghiệm: Phát âm Anh-Anh'
        description:
          type: string
        targetLocale:
          type: string
          example: en-GB
        currentRevisionId:
          type: string
          format: uuid
        currentRevisionVersion:
          type: string
          example: 1.0.0

    CurriculumDetailResponse:
      type: object
      required: [id, slug, title, description, targetLocale, authors, provenance, revision]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        targetLocale:
          type: string
        revision:
          $ref: '#/components/schemas/RevisionOutlineResponse'
        authors:
          type: array
          items:
            type: string
        provenance:
          $ref: '#/components/schemas/CurriculumProvenanceResponse'

    CurriculumProvenanceResponse:
      type: object
      required: [sourceName, sourceUrl, sourceLicense, authorCompiled, verificationStatus]
      properties:
        sourceName:
          type: string
        sourceUrl:
          type: [string, 'null']
        sourceLicense:
          type: string
        authorCompiled:
          type: boolean
        verificationStatus:
          type: string
          enum: [UNVERIFIED_DRAFT, LINK_CHECKED, PEDAGOGICALLY_REVIEWED]

    RevisionOutlineResponse:
      type: object
      required: [id, version, status, phases]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          example: 1.0.0
        status:
          $ref: '#/components/schemas/RevisionStatus'
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PhaseOutlineDto'

    PhaseOutlineDto:
      type: object
      required: [id, key, title, orderIndex, weeks]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: pilot.phase01
        title:
          type: string
        orderIndex:
          type: integer
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeekOutlineDto'

    WeekOutlineDto:
      type: object
      required: [id, key, title, weekNumber, orderIndex, lessons]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: pilot.w01
        title:
          type: string
        weekNumber:
          type: integer
        orderIndex:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonOutlineDto'

    LessonOutlineDto:
      type: object
      required: [id, key, title, orderIndex, estimatedMinutes, required]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: pilot.w01.l01
        title:
          type: string
        orderIndex:
          type: integer
        estimatedMinutes:
          type: integer
          example: 25
        required:
          type: boolean

    # --- Enrollment Models ---
    CreateEnrollmentRequest:
      type: object
      required: [curriculumId, revisionId, startDate, studyDays, dailyTargetMinutes, timeZone]
      properties:
        curriculumId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          example: '2026-10-26'
        studyDays:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
          minItems: 1
          example: [MONDAY, WEDNESDAY, FRIDAY]
        dailyTargetMinutes:
          type: integer
          minimum: 10
          maximum: 180
          example: 30
        timeZone:
          type: string
          example: Asia/Ho_Chi_Minh

    EnrollmentResponse:
      type: object
      required: [id, userId, curriculumId, revisionId, status, startDate, timeZone, studyDays, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        curriculumId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        startDate:
          type: string
          format: date
        timeZone:
          type: string
        studyDays:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        version:
          type: integer
          format: int64
          example: 1

    EnrollmentDetailResponse:
      type: object
      required: [id, userId, curriculumId, revisionId, status, startDate, timeZone, studyDays, dailyTargetMinutes, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        curriculumId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        startDate:
          type: string
          format: date
        timeZone:
          type: string
        studyDays:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeek'
        dailyTargetMinutes:
          type: integer
          example: 30
        version:
          type: integer
          format: int64
          example: 1
        estimatedEndDate:
          type: [string, "null"]
          format: date
          example: '2026-11-20'

    EnrollmentSummaryResponse:
      type: object
      required: [id, curriculumTitle, revisionVersion, status, completedRequiredActivities, totalRequiredActivities, progressPercent, version]
      properties:
        id:
          type: string
          format: uuid
