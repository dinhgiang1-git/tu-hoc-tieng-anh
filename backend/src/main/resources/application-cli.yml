# =============================================================================
# CLI Profile Configuration (Content Importer / Publisher)
# =============================================================================
spring:
  main:
    web-application-type: none
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: -1
